name: NSE Momentum Scanner

on:
  # GitHub's internal `schedule:` (cron) trigger has been unreliable — see
  # https://github.com/orgs/community/discussions/185352 and related threads
  # for widespread 2026 reports of scheduled triggers silently not firing or
  # drifting by hours, while workflow_dispatch keeps firing reliably. Rather
  # than fight that, an external scheduler (e.g. cron-job.org) calls the
  # GitHub REST API to fire workflow_dispatch on a real 10-minute cadence
  # during market hours instead. If GitHub's scheduler becomes reliable
  # again, the `schedule:` block below can be restored.
  workflow_dispatch: {}             # lets you trigger a manual test run from the Actions tab, and is what the external scheduler calls too

permissions:
  contents: write   # needed to commit the updated dedupe-state file back to the repo

concurrency:
  group: nse-scanner
  cancel-in-progress: false   # never kill a run that might be mid-scan; let it finish, skip overlap

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          KOTAK_CONSUMER_KEY: ${{ secrets.KOTAK_CONSUMER_KEY }}
          KOTAK_CONSUMER_SECRET: ${{ secrets.KOTAK_CONSUMER_SECRET }}
          KOTAK_MOBILE_NUMBER: ${{ secrets.KOTAK_MOBILE_NUMBER }}
          KOTAK_UCC: ${{ secrets.KOTAK_UCC }}
          KOTAK_MPIN: ${{ secrets.KOTAK_MPIN }}
          KOTAK_TOTP_SECRET: ${{ secrets.KOTAK_TOTP_SECRET }}
          KOTAK_ENVIRONMENT: prod
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          ALERT_TO_EMAILS: ${{ secrets.ALERT_TO_EMAILS }}
        run: python main.py --once

      # Each run is a brand-new disposable VM, so both state files need to be
      # committed back to the repo: the dedupe/OI file (data/alert_state.json)
      # and the once-a-day Yahoo Finance baseline cache (data/yf_cache.json).
      - name: Persist state
        run: |
          if [ -n "$(git status --porcelain data/alert_state.json data/yf_cache.json 2>/dev/null)" ]; then
            git config user.name "nse-scanner-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/alert_state.json data/yf_cache.json
            git commit -m "chore: update scanner state [skip ci]"
            git push
          else
            echo "No state change to commit"
          fi
