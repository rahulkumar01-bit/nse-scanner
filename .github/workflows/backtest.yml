name: NSE Scanner Backtest

# Manual-only, one-off analysis job — not part of the live scanning pipeline
# and never runs on a schedule. Trigger it from the Actions tab whenever you
# want to check how the current entry/target/stop-loss methodology (in
# screener.py) would have performed historically.
on:
  workflow_dispatch:
    inputs:
      months:
        description: "How many trailing months to backtest"
        required: false
        default: "6"
      symbols:
        description: "Optional comma-separated subset (e.g. RELIANCE,TCS) — leave blank for the full universe (slower)"
        required: false
        default: ""

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # a full-universe, 15-year-history backtest is heavier than a normal scan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest
        run: |
          if [ -n "${{ github.event.inputs.symbols }}" ]; then
            python backtest.py --months "${{ github.event.inputs.months }}" --symbols "${{ github.event.inputs.symbols }}"
          else
            python backtest.py --months "${{ github.event.inputs.months }}"
          fi

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: backtest_report.json
          retention-days: 30
